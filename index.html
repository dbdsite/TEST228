<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Stream Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0e0e10;
            height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }

        /* Кнопка настроек */
        .settings-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            background: #9146ff;
            color: white;
            cursor: pointer;
            font-size: 1.4rem;
            z-index: 1000;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-btn:hover {
            background: #772ce8;
            transform: rotate(90deg);
        }

        /* Модальное окно настроек */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #18181b;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 20px;
            background: #1f1f23;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2d2d35;
        }

        .modal-header h2 {
            color: #fff;
            font-size: 1.3rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
        }

        .modal-close:hover {
            color: #ff4444;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .setting-group {
            margin-bottom: 25px;
        }

        .setting-label {
            color: #fff;
            font-weight: 600;
            margin-bottom: 10px;
            display: block;
        }

        .setting-description {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }

        .grid-size-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .grid-slider {
            flex: 1;
            height: 8px;
            -webkit-appearance: none;
            appearance: none;
            background: #464649;
            border-radius: 4px;
            cursor: pointer;
        }

        .grid-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            background: #9146ff;
            border-radius: 50%;
            cursor: pointer;
        }

        .grid-value {
            color: #9146ff;
            font-weight: 700;
            font-size: 1.2rem;
            min-width: 30px;
            text-align: center;
        }

        .streamers-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .streamers-list::-webkit-scrollbar {
            width: 6px;
        }

        .streamers-list::-webkit-scrollbar-track {
            background: #0e0e10;
        }

        .streamers-list::-webkit-scrollbar-thumb {
            background: #9146ff;
            border-radius: 3px;
        }

        .streamer-input-row {
            display: flex;
            gap: 8px;
        }

        .streamer-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #2d2d35;
            border-radius: 8px;
            background: #0e0e10;
            color: #fff;
            font-size: 0.95rem;
        }

        .streamer-input:focus {
            outline: none;
            border-color: #9146ff;
        }

        .streamer-input::placeholder {
            color: #666;
        }

        .remove-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 8px;
            background: #ff4444;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        .remove-btn:hover {
            background: #cc0000;
        }

        .add-streamer-btn {
            width: 100%;
            padding: 12px;
            border: 2px dashed #2d2d35;
            border-radius: 8px;
            background: transparent;
            color: #9146ff;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .add-streamer-btn:hover {
            border-color: #9146ff;
            background: rgba(145, 70, 255, 0.1);
        }

        .modal-footer {
            padding: 20px;
            background: #1f1f23;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            border-top: 1px solid #2d2d35;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #9146ff;
            color: white;
        }

        .btn-primary:hover {
            background: #772ce8;
        }

        .btn-secondary {
            background: #2d2d35;
            color: white;
        }

        .btn-secondary:hover {
            background: #464649;
        }

        .warning-box {
            background: rgba(255, 165, 0, 0.1);
            border: 1px solid #ffa500;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .warning-box h4 {
            color: #ffa500;
            margin-bottom: 8px;
        }

        .warning-box p {
            color: #ccc;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .warning-box code {
            background: #0e0e10;
            padding: 2px 6px;
            border-radius: 4px;
            color: #9146ff;
        }

        /* === ОСНОВНОЙ ЛЕЙАУТ === */
        .wrapper {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* Сетка стримов - обычный режим */
        .container {
            flex: 1;
            display: grid;
            gap: 4px;
            padding: 4px;
        }

        .wrapper.has-active .container {
            display: none;
        }

        /* === АКТИВНЫЙ ВИД === */
        .active-view {
            display: none;
            flex: 1;
            flex-direction: row;
            gap: 4px;
            padding: 4px;
            height: 100vh;
        }

        .wrapper.has-active .active-view {
            display: flex;
        }

        /* Левая часть - плеер + контролы + нижние стримы */
        .left-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        /* Основной плеер */
        .main-player {
            flex: 1;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            min-height: 0;
        }

        .main-player iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Панель с ником */
        .player-info {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            background: #18181b;
            border-radius: 8px;
            gap: 20px;
        }

        .active-streamer-name {
            color: #fff;
            font-weight: 700;
            font-size: 1.4rem;
            text-align: center;
        }

        .close-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: #ff4444;
            color: white;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .close-btn:hover {
            background: #cc0000;
            transform: scale(1.1);
        }

        /* Нижние стримы под плеером */
        .bottom-streams {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            height: 140px;
            flex-shrink: 0;
        }

        /* Правая колонка - остальные стримы */
        .sidebar {
            width: 180px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: #18181b;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #9146ff;
            border-radius: 3px;
        }

        /* === СТРИМ БОКС === */
        .stream-box {
            background: #000;
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 2px solid #2d2d35;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }

        .stream-box:hover {
            border-color: #9146ff;
            transform: scale(1.02);
            z-index: 10;
        }

        /* Офлайн - черный фон с красным ником */
        .stream-box.offline {
            background: #000;
            cursor: default;
        }

        .stream-box.offline:hover {
            transform: none;
            border-color: #2d2d35;
        }

        .stream-box .streamer-name {
            color: #ff4444;
            font-weight: 700;
            font-size: 1.1rem;
            text-align: center;
            padding: 10px;
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
            z-index: 5;
        }

        /* Онлайн - показываем плеер */
        .stream-box.online {
            cursor: pointer;
        }

        .stream-box.online .streamer-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            color: #fff;
            padding: 20px 8px 6px;
            font-size: 0.85rem;
            text-shadow: none;
        }

        /* Мини-плеер */
        .stream-box .mini-player {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .stream-box.online .mini-player {
            display: block;
        }

        .stream-box .mini-player iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
        }

        /* Оверлей для клика */
        .stream-box .click-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: transparent;
        }

        /* LIVE индикатор */
        .live-indicator {
            display: none;
            position: absolute;
            top: 6px;
            left: 6px;
            background: #ff0000;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 700;
            z-index: 15;
            animation: pulse 2s infinite;
        }

        .stream-box.online .live-indicator {
            display: block;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Загрузка */
        .stream-box .loading-spinner {
            display: none;
            width: 30px;
            height: 30px;
            border: 3px solid #2d2d35;
            border-top-color: #9146ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            position: absolute;
            z-index: 5;
        }

        .stream-box.loading .loading-spinner {
            display: block;
        }

        .stream-box.loading .streamer-name {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Текущий активный */
        .stream-box.current {
            border-color: #9146ff;
            box-shadow: 0 0 15px rgba(145, 70, 255, 0.5);
        }

        /* Сайдбар боксы */
        .sidebar .stream-box {
            min-height: 90px;
            flex-shrink: 0;
        }

        .sidebar .stream-box .streamer-name {
            font-size: 0.8rem;
        }

        /* Нижние боксы - побольше */
        .bottom-streams .stream-box {
            height: 100%;
        }

        .bottom-streams .stream-box .streamer-name {
            font-size: 0.9rem;
        }

        /* === RESPONSIVE === */
        @media (max-width: 1200px) {
            .sidebar {
                width: 150px;
            }

            .bottom-streams {
                grid-template-columns: repeat(3, 1fr);
                height: 120px;
            }
        }

        @media (max-width: 900px) {
            .sidebar {
                width: 120px;
            }

            .sidebar .stream-box {
                min-height: 70px;
            }

            .bottom-streams {
                height: 100px;
            }

            .active-streamer-name {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 700px) {
            .active-view {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                flex-direction: row;
                height: 80px;
                overflow-x: auto;
                overflow-y: hidden;
            }

            .sidebar .stream-box {
                min-width: 100px;
                min-height: unset;
                height: 100%;
            }

            .bottom-streams {
                grid-template-columns: repeat(2, 1fr);
                height: 90px;
            }

            .close-btn {
                width: 36px;
                height: 36px;
            }

            .active-streamer-name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <button class="settings-btn" id="settingsBtn">⚙️</button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2>⚙️ Настройки</h2>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-body">
                <div class="warning-box">
                    <h4>⚠️ Важно для работы</h4>
                    <p>
                        Запустите сервер в папке с файлом:<br><br>
                        <code>python -m http.server 8000</code><br><br>
                        Откройте: <code>http://localhost:8000</code>
                    </p>
                </div>

                <div class="setting-group">
                    <label class="setting-label">Количество стримеров</label>
                    <p class="setting-description">От 1 до 20</p>
                    <div class="grid-size-container">
                        <input type="range" class="grid-slider" id="gridSlider" min="1" max="20" value="20">
                        <span class="grid-value" id="gridValue">20</span>
                    </div>
                </div>

                <div class="setting-group">
                    <label class="setting-label">Стримеры</label>
                    <p class="setting-description">Ссылки или ники Twitch</p>
                    <div class="streamers-list" id="streamersList"></div>
                    <button class="add-streamer-btn" id="addStreamerBtn">+ Добавить</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="resetBtn">Сбросить</button>
                <button class="btn btn-primary" id="saveBtn">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="wrapper" id="wrapper">
        <!-- Сетка - обычный режим -->
        <div class="container" id="container"></div>

        <!-- Активный вид -->
        <div class="active-view" id="activeView">
            <div class="left-section">
                <div class="main-player" id="mainPlayer">
                    <iframe id="playerFrame" allowfullscreen></iframe>
                </div>
                <div class="player-info">
                    <span class="active-streamer-name" id="activeStreamerName"></span>
                    <button class="close-btn" id="closeBtn">✕</button>
                </div>
                <div class="bottom-streams" id="bottomStreams"></div>
            </div>
            <div class="sidebar" id="sidebar"></div>
        </div>
    </div>

    <script>
        const defaultStreamers = [
            "xqc", "bratishkinoff", "silvername", "c_a_k_e", "shroud",
            "summit1g", "lirik", "pokimane", "pestily", "asmongold",
            "hasanabi", "mizkif", "ludwig", "sykkuno", "kaicenat",
            "cohhcarnage", "ironmouse", "nmplol", "esfandtv", "tarik"
        ];

        function loadSettings() {
            const saved = localStorage.getItem('multiStreamSettings');
            if (saved) {
                try { return JSON.parse(saved); } catch (e) { return null; }
            }
            return null;
        }

        function saveSettings(settings) {
            localStorage.setItem('multiStreamSettings', JSON.stringify(settings));
        }

        function getCurrentSettings() {
            const saved = loadSettings();
            return {
                gridSize: saved?.gridSize || 20,
                streamers: saved?.streamers || [...defaultStreamers]
            };
        }

        let settings = getCurrentSettings();

        const wrapper = document.getElementById('wrapper');
        const container = document.getElementById('container');
        const playerFrame = document.getElementById('playerFrame');
        const activeStreamerName = document.getElementById('activeStreamerName');
        const closeBtn = document.getElementById('closeBtn');
        const bottomStreams = document.getElementById('bottomStreams');
        const sidebar = document.getElementById('sidebar');

        const settingsBtn = document.getElementById('settingsBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalClose = document.getElementById('modalClose');
        const gridSlider = document.getElementById('gridSlider');
        const gridValue = document.getElementById('gridValue');
        const streamersList = document.getElementById('streamersList');
        const addStreamerBtn = document.getElementById('addStreamerBtn');
        const saveBtn = document.getElementById('saveBtn');
        const resetBtn = document.getElementById('resetBtn');

        let activeChannel = null;
        let streamStatuses = {};

        function extractChannelName(input) {
            input = input.trim();
            const match = input.match(/(?:https?:\/\/)?(?:www\.)?twitch\.tv\/([a-zA-Z0-9_]+)/i);
            if (match) return match[1].toLowerCase();
            return input.toLowerCase().replace(/[^a-z0-9_]/g, '');
        }

        function getParentDomain() {
            const hostname = window.location.hostname;
            return (hostname === '' || hostname === 'null') ? 'localhost' : hostname;
        }

        // Проверка статуса через превью
        async function checkStreamStatus(channel) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = `https://static-cdn.jtvnw.net/previews-ttv/live_user_${channel}-320x180.jpg?t=${Date.now()}`;
                
                const timeout = setTimeout(() => resolve({ online: false }), 5000);

                img.onload = () => {
                    clearTimeout(timeout);
                    // Twitch возвращает серую картинку-заглушку для офлайн каналов
                    // Она имеет размер 320x180, но мы можем проверить через canvas
                    resolve({ online: true });
                };
                
                img.onerror = () => {
                    clearTimeout(timeout);
                    resolve({ online: false });
                };
            });
        }

        function calculateGrid(count) {
            if (count <= 1) return { cols: 1, rows: 1 };
            if (count <= 2) return { cols: 2, rows: 1 };
            if (count <= 4) return { cols: 2, rows: 2 };
            if (count <= 6) return { cols: 3, rows: 2 };
            if (count <= 9) return { cols: 3, rows: 3 };
            if (count <= 12) return { cols: 4, rows: 3 };
            if (count <= 16) return { cols: 4, rows: 4 };
            return { cols: 5, rows: 4 };
        }

        function updateGridLayout() {
            const count = Math.min(settings.gridSize, settings.streamers.length);
            const { cols, rows } = calculateGrid(count);
            container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            container.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
        }

        // Создание бокса
        function createStreamBox(channel) {
            const displayName = channel.charAt(0).toUpperCase() + channel.slice(1);
            const parent = getParentDomain();
            
            const box = document.createElement('div');
            box.className = 'stream-box loading';
            box.dataset.channel = channel;
            box.dataset.name = displayName;

            box.innerHTML = `
                <div class="loading-spinner"></div>
                <div class="mini-player"></div>
                <div class="click-overlay"></div>
                <div class="live-indicator">LIVE</div>
                <span class="streamer-name">${displayName}</span>
            `;

            const overlay = box.querySelector('.click-overlay');
            overlay.addEventListener('click', () => {
                if (box.classList.contains('online')) {
                    openStream(channel, displayName);
                }
            });

            return box;
        }

        // Загрузка мини-плеера
        function loadMiniPlayer(box, channel) {
            const parent = getParentDomain();
            const miniPlayer = box.querySelector('.mini-player');
            
            // Очищаем старый iframe если есть
            miniPlayer.innerHTML = '';
            
            // Создаем новый iframe
            const iframe = document.createElement('iframe');
            iframe.src = `https://player.twitch.tv/?channel=${channel}&parent=${parent}&muted=true&autoplay=true&controls=false`;
            iframe.setAttribute('allowfullscreen', 'true');
            iframe.style.pointerEvents = 'none';
            
            miniPlayer.appendChild(iframe);
        }

        // Обновление статуса бокса
        async function updateStreamBox(box) {
            const channel = box.dataset.channel;
            
            box.classList.add('loading');
            box.classList.remove('online', 'offline');
            
            // Очищаем мини-плеер
            const miniPlayer = box.querySelector('.mini-player');
            miniPlayer.innerHTML = '';
            
            const status = await checkStreamStatus(channel);
            streamStatuses[channel] = status;
            
            box.classList.remove('loading');

            if (status.online) {
                box.classList.add('online');
                box.classList.remove('offline');
                // Загружаем мини-плеер
                loadMiniPlayer(box, channel);
            } else {
                box.classList.add('offline');
                box.classList.remove('online');
                // Для офлайн - оставляем черный фон с красным ником (уже есть в HTML)
            }
        }

        // Открытие стрима
        function openStream(channel, name) {
            if (activeChannel === channel) {
                closeStream();
                return;
            }

            activeChannel = channel;
            wrapper.classList.add('has-active');

            const parent = getParentDomain();
            playerFrame.src = `https://player.twitch.tv/?channel=${channel}&parent=${parent}&muted=false&autoplay=true`;
            activeStreamerName.textContent = name;

            // Получаем остальных стримеров
            const otherStreamers = settings.streamers.filter(s => s !== channel);
            
            // Нижние стримы (первые 4)
            bottomStreams.innerHTML = '';
            const bottomCount = Math.min(4, otherStreamers.length);
            for (let i = 0; i < bottomCount; i++) {
                const streamer = otherStreamers[i];
                const box = createStreamBox(streamer);
                applyKnownStatus(box, streamer);
                bottomStreams.appendChild(box);
            }

            // Боковые стримы (остальные)
            sidebar.innerHTML = '';
            for (let i = bottomCount; i < otherStreamers.length; i++) {
                const streamer = otherStreamers[i];
                const box = createStreamBox(streamer);
                applyKnownStatus(box, streamer);
                sidebar.appendChild(box);
            }
        }

        // Применение известного статуса
        function applyKnownStatus(box, channel) {
            box.classList.remove('loading');
            
            if (streamStatuses[channel]?.online) {
                box.classList.add('online');
                loadMiniPlayer(box, channel);
            } else {
                box.classList.add('offline');
            }
        }

        // Закрытие стрима
        function closeStream() {
            activeChannel = null;
            wrapper.classList.remove('has-active');
            playerFrame.src = '';
            activeStreamerName.textContent = '';
            bottomStreams.innerHTML = '';
            sidebar.innerHTML = '';
        }

        closeBtn.addEventListener('click', closeStream);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (modalOverlay.classList.contains('active')) {
                    closeModal();
                } else if (activeChannel) {
                    closeStream();
                }
            }
        });

        // === Модальное окно ===
        function openModal() {
            modalOverlay.classList.add('active');
            renderStreamerInputs();
            gridSlider.value = settings.gridSize;
            gridValue.textContent = settings.gridSize;
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        function renderStreamerInputs() {
            streamersList.innerHTML = '';
            settings.streamers.forEach((channel, index) => {
                const row = document.createElement('div');
                row.className = 'streamer-input-row';
                row.innerHTML = `
                    <input type="text" class="streamer-input" value="https://www.twitch.tv/${channel}" 
                           placeholder="https://www.twitch.tv/username" data-index="${index}">
                    <button class="remove-btn" data-index="${index}">✕</button>
                `;
                streamersList.appendChild(row);
            });

            streamersList.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = parseInt(e.target.dataset.index);
                    settings.streamers.splice(index, 1);
                    renderStreamerInputs();
                });
            });
        }

        settingsBtn.addEventListener('click', openModal);
        modalClose.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        gridSlider.addEventListener('input', (e) => {
            gridValue.textContent = e.target.value;
        });

        addStreamerBtn.addEventListener('click', () => {
            settings.streamers.push('');
            renderStreamerInputs();
            const inputs = streamersList.querySelectorAll('.streamer-input');
            inputs[inputs.length - 1].focus();
        });

        saveBtn.addEventListener('click', () => {
            const inputs = streamersList.querySelectorAll('.streamer-input');
            const newStreamers = [];
            inputs.forEach(input => {
                const channel = extractChannelName(input.value);
                if (channel) newStreamers.push(channel);
            });

            settings.streamers = newStreamers;
            settings.gridSize = parseInt(gridSlider.value);
            
            saveSettings(settings);
            closeModal();
            initStreamers();
        });

        resetBtn.addEventListener('click', () => {
            settings = { gridSize: 20, streamers: [...defaultStreamers] };
            renderStreamerInputs();
            gridSlider.value = 20;
            gridValue.textContent = '20';
        });

        // Инициализация
        async function initStreamers() {
            container.innerHTML = '';
            streamStatuses = {};

            const count = Math.min(settings.gridSize, settings.streamers.length);
            const streamersToShow = settings.streamers.slice(0, count);

            updateGridLayout();

            // Создаём боксы
            streamersToShow.forEach(channel => {
                const box = createStreamBox(channel);
                container.appendChild(box);
            });

            // Проверяем статусы и загружаем плееры
            const boxes = document.querySelectorAll('#container .stream-box');
            for (const box of boxes) {
                await updateStreamBox(box);
            }
        }

        // Обновление каждые 2 минуты
        setInterval(async () => {
            if (!wrapper.classList.contains('has-active')) {
                const boxes = document.querySelectorAll('#container .stream-box');
                for (const box of boxes) {
                    await updateStreamBox(box);
                }
            }
        }, 120000);

        initStreamers();
    </script>
</body>
</html>
