<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" href="https://static-cdn.jtvnw.net/jtv_user_pictures/481347b6-d915-4e3f-bb44-613a427e79f1-profile_image-70x70.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>by Lagerta_Seeman</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }

        /* Страница входа */
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .login-container h2 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2rem;
        }

        .login-input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .login-input:focus {
            outline: none;
            border-color: #764ba2;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .error-message {
            color: #ff4444;
            text-align: center;
            margin-top: 15px;
            font-weight: 500;
        }

        /* Основной интерфейс */
        .main-interface {
            display: none;
            height: 100vh;
            position: relative;
        }

        .settings-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            background: #9146ff;
            color: white;
            cursor: pointer;
            font-size: 1.4rem;
            z-index: 1000;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-btn:hover {
            background: #772ce8;
            transform: rotate(90deg);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #18181b;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 20px;
            background: #1f1f23;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2d2d35;
        }

        .modal-header h2 {
            color: #fff;
            font-size: 1.3rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #ff4444;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .setting-group {
            margin-bottom: 25px;
        }

        .setting-label {
            color: #fff;
            font-weight: 600;
            margin-bottom: 10px;
            display: block;
        }

        .grid-size-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .grid-slider {
            flex: 1;
            height: 8px;
            -webkit-appearance: none;
            background: #464649;
            border-radius: 4px;
            cursor: pointer;
        }

        .grid-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            background: #9146ff;
            border-radius: 50%;
            cursor: pointer;
        }

        .grid-value {
            color: #9146ff;
            font-weight: 700;
            font-size: 1.2rem;
            min-width: 30px;
            text-align: center;
        }

        .streamers-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
        }

        .streamers-list::-webkit-scrollbar {
            width: 6px;
        }

        .streamers-list::-webkit-scrollbar-thumb {
            background: #9146ff;
            border-radius: 3px;
        }

        .streamer-input-row {
            display: flex;
            gap: 8px;
        }

        .streamer-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #2d2d35;
            border-radius: 8px;
            background: #0e0e10;
            color: #fff;
            font-size: 0.95rem;
        }

        .streamer-input:focus {
            outline: none;
            border-color: #9146ff;
        }

        .remove-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 8px;
            background: #ff4444;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .remove-btn:hover {
            background: #cc0000;
        }

        .add-streamer-btn {
            width: 100%;
            padding: 12px;
            border: 2px dashed #2d2d35;
            border-radius: 8px;
            background: transparent;
            color: #9146ff;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
        }

        .add-streamer-btn:hover {
            border-color: #9146ff;
            background: rgba(145, 70, 255, 0.1);
        }

        .password-section {
            margin-top: 20px;
            padding: 15px;
            background: #1f1f23;
            border-radius: 8px;
        }

        .password-display {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        .password-input {
            flex: 1;
            padding: 10px;
            background: #0e0e10;
            border: 2px solid #2d2d35;
            border-radius: 8px;
            color: #fff;
            font-family: monospace;
            font-size: 1rem;
        }

        .generate-btn {
            padding: 10px 20px;
            background: #9146ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .generate-btn:hover {
            background: #772ce8;
        }

        .modal-footer {
            padding: 20px;
            background: #1f1f23;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            border-top: 1px solid #2d2d35;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
        }

        .btn-primary {
            background: #9146ff;
            color: white;
        }

        .btn-primary:hover {
            background: #772ce8;
        }

        .btn-secondary {
            background: #2d2d35;
            color: white;
        }

        .btn-secondary:hover {
            background: #464649;
        }

        .warning-box {
            background: rgba(255, 165, 0, 0.1);
            border: 1px solid #ffa500;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .warning-box h4 {
            color: #ffa500;
            margin-bottom: 8px;
        }

        .warning-box p {
            color: #ccc;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .warning-box code {
            background: #0e0e10;
            padding: 2px 6px;
            border-radius: 4px;
            color: #9146ff;
        }

        .wrapper {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
            display: grid;
            gap: 4px;
            padding: 4px;
        }

        .wrapper.has-active .container {
            display: none;
        }

        .active-view {
            display: none;
            flex: 1;
            flex-direction: row;
            gap: 4px;
            padding: 4px;
            height: 100vh;
        }

        .wrapper.has-active .active-view {
            display: flex;
        }

        .left-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .main-player {
            flex: 1;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            min-height: 0;
        }

        .main-player iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-info {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            background: #18181b;
            border-radius: 8px;
            gap: 20px;
        }

        .active-streamer-name {
            color: #fff;
            font-weight: 700;
            font-size: 1.4rem;
        }

        .close-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: #ff4444;
            color: white;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: #cc0000;
            transform: scale(1.1);
        }

        .bottom-streams {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            height: 160px;
            flex-shrink: 0;
            position: relative;
        }

        .sidebar {
            width: 180px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #9146ff;
            border-radius: 3px;
        }

        /* СТРИМ БОКС */
        .stream-box {
            background: #000;
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
            border: 2px solid #2d2d35;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }

        .stream-box:hover {
            border-color: #9146ff;
            transform: scale(1.02);
            z-index: 10;
        }

        .stream-box.dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }

        .stream-box.drag-over {
            border-color: #00ff00 !important;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .stream-box.offline {
            cursor: default;
            background: #000;
        }

        .stream-box.offline:hover {
            transform: none;
            border-color: #2d2d35;
        }

        .stream-box .streamer-name {
            color: #ff4444;
            font-weight: 700;
            font-size: 1.1rem;
            text-align: center;
            padding: 10px;
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
            z-index: 5;
            position: relative;
        }

        .stream-box.online .streamer-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            color: #fff;
            padding: 20px 8px 6px;
            font-size: 0.85rem;
            text-shadow: none;
        }

        .stream-box .preview-img {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .stream-box.online .preview-img {
            display: block;
        }

        .stream-box .mini-player {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .stream-box.online.with-player .preview-img {
            display: none;
        }

        .stream-box.online.with-player .mini-player {
            display: block;
        }

        .stream-box .mini-player iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
        }

        .stream-box .click-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .stream-box .loading-spinner {
            display: none;
            width: 30px;
            height: 30px;
            border: 3px solid #2d2d35;
            border-top-color: #9146ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            position: absolute;
            z-index: 5;
        }

        .stream-box.loading .loading-spinner {
            display: block;
        }

        .stream-box.loading .streamer-name {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .sidebar .stream-box {
            min-height: 100px;
            flex-shrink: 0;
        }

        .sidebar .stream-box .streamer-name {
            font-size: 0.85rem;
        }

        .bottom-streams .stream-box {
            height: 100%;
        }

        .bottom-streams .stream-box .streamer-name {
            font-size: 0.95rem;
        }

        .drag-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(145, 70, 255, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            z-index: 100;
            display: none;
        }

        .wrapper.has-active .drag-hint {
            display: block;
        }

        @media (max-width: 1200px) {
            .sidebar { width: 150px; }
            .bottom-streams {
                grid-template-columns: repeat(3, 1fr);
                height: 140px;
            }
        }

        @media (max-width: 900px) {
            .sidebar { width: 120px; }
            .sidebar .stream-box { min-height: 80px; }
            .bottom-streams { height: 120px; }
            .active-streamer-name { font-size: 1.1rem; }
        }

        @media (max-width: 700px) {
            .active-view { flex-direction: column; }
            .sidebar {
                width: 100%;
                flex-direction: row;
                height: 80px;
                overflow-x: auto;
                overflow-y: hidden;
            }
            .sidebar .stream-box {
                min-width: 100px;
                min-height: unset;
                height: 100%;
            }
            .bottom-streams {
                grid-template-columns: repeat(2, 1fr);
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <!-- Страница входа -->
    <div class="login-page" id="loginPage">
        <div class="login-container">
            <h2>Вход в систему</h2>
            <input type="text" class="login-input" id="loginUsername" placeholder="Логин" autocomplete="off">
            <input type="password" class="login-input" id="loginPassword" placeholder="Пароль">
            <button class="login-btn" id="loginBtn">Войти</button>
            <div class="error-message" id="loginError"></div>
        </div>
    </div>

    <!-- Основной интерфейс -->
    <div class="main-interface" id="mainInterface">
        <button class="settings-btn" id="settingsBtn" style="display: none;">⚙️</button>

        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <div class="modal-header">
                    <h2>⚙️ Настройки администратора</h2>
                    <button class="modal-close" id="modalClose">✕</button>
                </div>
                <div class="modal-body">

                    <div class="setting-group">
                        <label class="setting-label">Количество стримеров</label>
                        <div class="grid-size-container">
                            <input type="range" class="grid-slider" id="gridSlider" min="1" max="20" value="20">
                            <span class="grid-value" id="gridValue">20</span>
                        </div>
                    </div>

                    <div class="setting-group">
                        <label class="setting-label">Стримеры</label>
                        <div class="streamers-list" id="streamersList"></div>
                        <button class="add-streamer-btn" id="addStreamerBtn">+ Добавить</button>
                    </div>

                    <div class="password-section">
                        <label class="setting-label">Управление доступом пользователей</label>
                        <div class="password-display">
                            <input type="text" class="password-input" id="currentPassword" readonly placeholder="Текущий пароль" value="Не установлен">
                            <button class="generate-btn" id="generatePassword">Сгенерировать</button>
                        </div>
                        <p style="color: #ccc; font-size: 0.85rem;">После генерации старый пароль перестанет работать</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="resetBtn">Сбросить</button>
                    <button class="btn btn-primary" id="saveBtn">Сохранить</button>
                </div>
            </div>
        </div>

        <div class="wrapper" id="wrapper">
            <div class="container" id="container"></div>

            <div class="active-view" id="activeView">
                <div class="left-section">
                    <div class="main-player" id="mainPlayer">
                        <iframe id="playerFrame" allow="autoplay; fullscreen" allowfullscreen></iframe>
                    </div>
                    <div class="player-info">
                        <span class="active-streamer-name" id="activeStreamerName"></span>
                        <button class="close-btn" id="closeBtn">✕</button>
                    </div>
                    <div class="bottom-streams" id="bottomStreams"></div>
                </div>
                <div class="sidebar" id="sidebar"></div>
            </div>
        </div>
    </div>

    <script>
        // Конфигурация
        const ADMIN_USERNAME = 'admin';
        const ADMIN_PASSWORD = 'admin123';
        
        // Глобальные переменные
        let settings = { gridSize: 20, streamers: [] };
        let currentUser = null;
        let currentPassword = null;
        let activeChannel = null;
        let streamStatuses = {};
        let bottomStreamers = [];
        let sidebarStreamers = [];

        // DOM элементы
        const loginPage = document.getElementById('loginPage');
        const mainInterface = document.getElementById('mainInterface');
        const loginBtn = document.getElementById('loginBtn');
        const loginUsername = document.getElementById('loginUsername');
        const loginPassword = document.getElementById('loginPassword');
        const loginError = document.getElementById('loginError');
        const settingsBtn = document.getElementById('settingsBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalClose = document.getElementById('modalClose');
        const gridSlider = document.getElementById('gridSlider');
        const gridValue = document.getElementById('gridValue');
        const streamersList = document.getElementById('streamersList');
        const addStreamerBtn = document.getElementById('addStreamerBtn');
        const saveBtn = document.getElementById('saveBtn');
        const resetBtn = document.getElementById('resetBtn');
        const generatePassword = document.getElementById('generatePassword');
        const currentPasswordInput = document.getElementById('currentPassword');
        const container = document.getElementById('container');
        const wrapper = document.getElementById('wrapper');
        const playerFrame = document.getElementById('playerFrame');
        const activeStreamerName = document.getElementById('activeStreamerName');
        const closeBtn = document.getElementById('closeBtn');
        const bottomStreams = document.getElementById('bottomStreams');
        const sidebar = document.getElementById('sidebar');

        // Загрузка данных из файлов
        async function loadData() {
            try {
                // Загружаем пароль
                const passResponse = await fetch('/password.txt?' + Date.now());
                if (passResponse.ok) {
                    currentPassword = (await passResponse.text()).trim();
                    if (currentPassword) {
                        currentPasswordInput.value = currentPassword;
                    }
                }

                // Загружаем стримеров
                const dataResponse = await fetch('/data.txt?' + Date.now());
                if (dataResponse.ok) {
                    const data = await dataResponse.text();
                    settings.streamers = data.split('\n')
                        .map(line => line.trim())
                        .filter(line => line && !line.startsWith('#'));
                } else {
                    // Если файла нет, используем дефолтных
                    settings.streamers = [
                        "xqc", "bratishkinoff", "silvername", "c_a_k_e", "shroud",
                        "summit1g", "lirik", "pokimane", "pestily", "asmongold"
                    ];
                }
            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                settings.streamers = [
                    "xqc", "bratishkinoff", "silvername", "c_a_k_e", "shroud"
                ];
            }
        }

        // Сохранение стримеров в data.txt
        async function saveStreamersToFile() {
            try {
                const response = await fetch('/save_data.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'streamers=' + encodeURIComponent(settings.streamers.join('\n'))
                });
                if (!response.ok) console.error('Ошибка сохранения data.txt');
            } catch (error) {
                console.error('Ошибка сохранения:', error);
            }
        }

        // Сохранение пароля в password.txt
        async function savePasswordToFile(password) {
            try {
                const response = await fetch('/save_password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'password=' + encodeURIComponent(password)
                });
                if (response.ok) {
                    currentPassword = password;
                    currentPasswordInput.value = password;
                }
            } catch (error) {
                console.error('Ошибка сохранения пароля:', error);
            }
        }

        // Генерация случайного пароля
        function generateRandomPassword() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let password = '';
            for (let i = 0; i < 12; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return password;
        }

        // Вход в систему
        loginBtn.addEventListener('click', async () => {
            const username = loginUsername.value.trim();
            const password = loginPassword.value.trim();

            if (!username || !password) {
                loginError.textContent = 'Введите логин и пароль';
                return;
            }

            // Проверка администратора
            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                currentUser = 'admin';
                loginPage.style.display = 'none';
                mainInterface.style.display = 'block';
                settingsBtn.style.display = 'flex';
                await loadData();
                initStreamers();
                return;
            }

            // Проверка пользователя
            if (currentPassword && password === currentPassword) {
                currentUser = 'user';
                loginPage.style.display = 'none';
                mainInterface.style.display = 'block';
                settingsBtn.style.display = 'none';
                await loadData();
                initStreamers();
                return;
            }

            loginError.textContent = 'Неверный логин или пароль';
        });

        // Enter для входа
        loginPassword.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });

        // Генерация нового пароля
        generatePassword.addEventListener('click', () => {
            const newPassword = generateRandomPassword();
            savePasswordToFile(newPassword);
        });

        // Функции интерфейса
        function extractChannelName(input) {
            input = input.trim();
            const match = input.match(/(?:https?:\/\/)?(?:www\.)?twitch\.tv\/([a-zA-Z0-9_]+)/i);
            if (match) return match[1].toLowerCase();
            return input.toLowerCase().replace(/[^a-z0-9_]/g, '');
        }

        function getParentDomain() {
            const hostname = window.location.hostname;
            return (hostname === '' || hostname === 'null') ? 'localhost' : hostname;
        }

        function calculateGrid(count) {
            if (count <= 1) return { cols: 1, rows: 1 };
            if (count <= 2) return { cols: 2, rows: 1 };
            if (count <= 4) return { cols: 2, rows: 2 };
            if (count <= 6) return { cols: 3, rows: 2 };
            if (count <= 9) return { cols: 3, rows: 3 };
            if (count <= 12) return { cols: 4, rows: 3 };
            if (count <= 16) return { cols: 4, rows: 4 };
            return { cols: 5, rows: 4 };
        }

        function updateGridLayout() {
            const count = Math.min(settings.gridSize, settings.streamers.length);
            const { cols, rows } = calculateGrid(count);
            container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            container.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
        }

        function createGridBox(channel) {
            const displayName = channel.charAt(0).toUpperCase() + channel.slice(1);
            const parent = getParentDomain();
            
            const box = document.createElement('div');
            box.className = 'stream-box';
            box.dataset.channel = channel;
            box.dataset.name = displayName;

            box.innerHTML = `
                <div class="mini-player">
                    <iframe 
                        src="https://player.twitch.tv/?channel=${channel}&parent=${parent}&muted=true&autoplay=true&controls=false"
                        allow="autoplay; fullscreen"
                        allowfullscreen>
                    </iframe>
                </div>
                <div class="click-overlay"></div>
                <span class="streamer-name">${displayName}</span>
            `;

            box.classList.add('online', 'with-player');

            const overlay = box.querySelector('.click-overlay');
            overlay.addEventListener('click', () => {
                openStream(channel, displayName);
            });

            return box;
        }

        function createActiveBox(channel, location) {
            const displayName = channel.charAt(0).toUpperCase() + channel.slice(1);
            const parent = getParentDomain();
            
            const box = document.createElement('div');
            box.className = 'stream-box online with-player';
            box.dataset.channel = channel;
            box.dataset.name = displayName;
            box.dataset.location = location;
            box.draggable = currentUser === 'admin';

            box.innerHTML = `
                <div class="mini-player">
                    <iframe 
                        src="https://player.twitch.tv/?channel=${channel}&parent=${parent}&muted=true&autoplay=true&controls=false"
                        allow="autoplay; fullscreen"
                        allowfullscreen>
                    </iframe>
                </div>
                <div class="click-overlay"></div>
                <span class="streamer-name">${displayName}</span>
            `;

            const overlay = box.querySelector('.click-overlay');
            overlay.addEventListener('click', () => {
                openStream(channel, displayName);
            });

            if (currentUser === 'admin') {
                box.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', channel);
                    e.dataTransfer.setData('location', location);
                    box.classList.add('dragging');
                });

                box.addEventListener('dragend', () => {
                    box.classList.remove('dragging');
                    document.querySelectorAll('.stream-box').forEach(b => b.classList.remove('drag-over'));
                });

                box.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    box.classList.add('drag-over');
                });

                box.addEventListener('dragleave', () => {
                    box.classList.remove('drag-over');
                });

                box.addEventListener('drop', (e) => {
                    e.preventDefault();
                    box.classList.remove('drag-over');
                    
                    const draggedChannel = e.dataTransfer.getData('text/plain');
                    const draggedLocation = e.dataTransfer.getData('location');
                    const targetChannel = channel;
                    const targetLocation = location;

                    if (draggedChannel === targetChannel) return;

                    swapStreamers(draggedChannel, draggedLocation, targetChannel, targetLocation);
                });
            }

            return box;
        }

        function swapStreamers(channel1, loc1, channel2, loc2) {
            let idx1, idx2;
            
            if (loc1 === 'bottom') {
                idx1 = bottomStreamers.indexOf(channel1);
            } else {
                idx1 = sidebarStreamers.indexOf(channel1);
            }
            
            if (loc2 === 'bottom') {
                idx2 = bottomStreamers.indexOf(channel2);
            } else {
                idx2 = sidebarStreamers.indexOf(channel2);
            }

            if (loc1 === 'bottom' && loc2 === 'bottom') {
                [bottomStreamers[idx1], bottomStreamers[idx2]] = [bottomStreamers[idx2], bottomStreamers[idx1]];
            } else if (loc1 === 'sidebar' && loc2 === 'sidebar') {
                [sidebarStreamers[idx1], sidebarStreamers[idx2]] = [sidebarStreamers[idx2], sidebarStreamers[idx1]];
            } else if (loc1 === 'bottom' && loc2 === 'sidebar') {
                bottomStreamers[idx1] = channel2;
                sidebarStreamers[idx2] = channel1;
            } else if (loc1 === 'sidebar' && loc2 === 'bottom') {
                sidebarStreamers[idx1] = channel2;
                bottomStreamers[idx2] = channel1;
            }

            renderPanels();
        }

        function renderPanels() {
            bottomStreams.innerHTML = '';
            bottomStreamers.forEach(channel => {
                const box = createActiveBox(channel, 'bottom');
                bottomStreams.appendChild(box);
            });

            sidebar.innerHTML = '';
            sidebarStreamers.forEach(channel => {
                const box = createActiveBox(channel, 'sidebar');
                sidebar.appendChild(box);
            });
        }

        function openStream(channel, name) {
            if (activeChannel === channel) {
                closeStream();
                return;
            }

            activeChannel = channel;
            wrapper.classList.add('has-active');

            const parent = getParentDomain();
            playerFrame.src = `https://player.twitch.tv/?channel=${channel}&parent=${parent}&muted=false&autoplay=true`;
            activeStreamerName.textContent = name;

            const otherStreamers = settings.streamers.filter(s => s !== channel);
            const count = Math.min(settings.gridSize, otherStreamers.length);
            const streamersToUse = otherStreamers.slice(0, count);
            
            bottomStreamers = streamersToUse.slice(0, 4);
            sidebarStreamers = streamersToUse.slice(4);

            renderPanels();
        }

        function closeStream() {
            activeChannel = null;
            wrapper.classList.remove('has-active');
            playerFrame.src = '';
            activeStreamerName.textContent = '';
            bottomStreams.innerHTML = '';
            sidebar.innerHTML = '';
            bottomStreamers = [];
            sidebarStreamers = [];
        }

        function initStreamers() {
            container.innerHTML = '';

            const count = Math.min(settings.gridSize, settings.streamers.length);
            const streamersToShow = settings.streamers.slice(0, count);

            updateGridLayout();

            streamersToShow.forEach(channel => {
                const box = createGridBox(channel);
                container.appendChild(box);
            });
        }

        // Обработчики интерфейса
        closeBtn.addEventListener('click', closeStream);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (modalOverlay.classList.contains('active')) {
                    closeModal();
                } else if (activeChannel) {
                    closeStream();
                }
            }
        });

        function openModal() {
            modalOverlay.classList.add('active');
            renderStreamerInputs();
            gridSlider.value = settings.gridSize;
            gridValue.textContent = settings.gridSize;
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        function renderStreamerInputs() {
            streamersList.innerHTML = '';
            settings.streamers.forEach((channel, index) => {
                const row = document.createElement('div');
                row.className = 'streamer-input-row';
                row.innerHTML = `
                    <input type="text" class="streamer-input" value="https://www.twitch.tv/${channel}" data-index="${index}">
                    <button class="remove-btn" data-index="${index}">✕</button>
                `;
                streamersList.appendChild(row);
            });

            streamersList.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    settings.streamers.splice(parseInt(e.target.dataset.index), 1);
                    renderStreamerInputs();
                });
            });
        }

        settingsBtn.addEventListener('click', openModal);
        modalClose.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        gridSlider.addEventListener('input', (e) => {
            gridValue.textContent = e.target.value;
        });

        addStreamerBtn.addEventListener('click', () => {
            settings.streamers.push('');
            renderStreamerInputs();
            const inputs = streamersList.querySelectorAll('.streamer-input');
            inputs[inputs.length - 1].focus();
        });

        saveBtn.addEventListener('click', () => {
            const inputs = streamersList.querySelectorAll('.streamer-input');
            const newStreamers = [];
            inputs.forEach(input => {
                const channel = extractChannelName(input.value);
                if (channel) newStreamers.push(channel);
            });

            settings.streamers = newStreamers;
            settings.gridSize = parseInt(gridSlider.value);
            
            saveStreamersToFile();
            closeModal();
            initStreamers();
        });

        resetBtn.addEventListener('click', () => {
            settings = { gridSize: 20, streamers: [...defaultStreamers] };
            renderStreamerInputs();
            gridSlider.value = 20;
            gridValue.textContent = '20';
        });
    </script>
</body>
</html>
